<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invito Matrimonio - Giorgio & Cristina</title>
    <style>
        /* --- STILI BASE --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #fdfaf6;
            font-family: 'Georgia', serif;
            /* L'altezza extra serve come "pista" per innescare lo scroll */
            height: 150vh; 
        }

        /* --- CONTENITORE FISSO E SCROLLABILE --- */
        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Sblocca lo scroll interno se i contenuti superano l'altezza dello schermo (Landscape) */
            overflow-y: auto; 
            overflow-x: hidden;
            scrollbar-width: none; /* Nasconde la scrollbar su Firefox */
        }
        
        .sticky-container::-webkit-scrollbar { 
            display: none; /* Nasconde la scrollbar su Chrome/Safari */
        }

        /* Trucco avanzato per centrare l'invito, ma permettere lo scroll se lo schermo è piccolo */
        .sticky-container::before,
        .sticky-container::after {
            content: '';
            flex: 1;
        }

        /* --- TESTO "SCORRI" --- */
        .scroll-hint {
            position: absolute;
            top: 5%;
            font-size: 1.2rem;
            color: #666;
            text-align: center;
            animation: bounce 2s infinite;
            transition: opacity 0.5s ease-in-out;
            z-index: 10;
            pointer-events: none; /* Impedisce che blocchi i tocchi sullo schermo */
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(10px); }
            60% { transform: translateY(5px); }
        }

        /* --- GRUPPO CONTENUTI --- */
        .content-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 40px 0; /* Margine di sicurezza sopra e sotto */
        }

        /* --- IL DISTANZIATORE MAGICO --- */
        /* Questo elemento cresce quando apri la busta, spingendola in basso in modo che il 
           biglietto che sale non esca MAI dalla parte superiore dello schermo. */
        .spacer {
            height: 0;
            width: 100%;
            transition: height 0.8s ease-in-out;
        }

        /* Calcolo esatto: il biglietto sale del 31% della larghezza dello schermo, 
           quindi il distanziatore spinge giù del 31% */
        .content-group.open .spacer {
            height: 31vw; 
        }

        /* Limite per gli schermi grandi (desktop) per evitare proporzioni sballate */
        @media (min-width: 833px) {
            .content-group.open .spacer {
                height: 260px; 
            }
        }

        /* --- CONTENITORE BUSTA E BIGLIETTO --- */
        .scene {
            position: relative;
            width: 90vw;
            max-width: 750px;
            aspect-ratio: 2.5 / 1; 
            perspective: 1500px;
        }

        /* --- LA BUSTA --- */
        .envelope-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #d1c5b4;
            border-radius: 5px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            z-index: 1;
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #e3d8c8;
            border-radius: 5px;
            z-index: 3;
            clip-path: polygon(0 100%, 100% 100%, 100% 0, 50% 50%, 0 0);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 60%;
            background-color: #c4b6a2;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 4;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
        }

        /* --- IL BIGLIETTO (ANIMATO) --- */
        .card-wrapper {
            position: absolute;
            bottom: 5%;
            left: 2.5%;
            width: 95%;
            height: 90%;
            z-index: 2;
            transition: transform 1s ease-in-out;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 5px;
            overflow: hidden;
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* --- ANIMAZIONI AL MOMENTO DELL'APERTURA --- */
        .content-group.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1; 
        }

        .content-group.open .card-wrapper {
            transform: translateY(-95%); 
            z-index: 5; 
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- SEZIONE RSVP (BOTTONE) --- */
        .rsvp-section {
            margin-top: 30px; 
            text-align: center;
            opacity: 0;
            visibility: hidden; 
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        .content-group.open .rsvp-section {
            opacity: 1;
            visibility: visible;
        }

        .rsvp-btn {
            background-color: #e2a527; 
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(226, 165, 39, 0.4);
            transition: background-color 0.3s, transform 0.2s;
            display: inline-block;
        }

        .rsvp-btn:hover {
            background-color: #9b8cbd; 
            transform: scale(1.05);
        }

        .tap-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }

        /* --- BANNER AUDIO --- */
        .volume-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background-color: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        .volume-banner.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .volume-banner.interactive {
            pointer-events: auto;
            cursor: pointer;
            background-color: #9b8cbd; /* Viola dal tuo tema per capire che è cliccabile */
            box-shadow: 0 10px 25px rgba(155, 140, 189, 0.5);
        }
    </style>
</head>
<body>

    <!-- TRACCIA AUDIO AGGIUNTA -->
    <audio id="invite-audio" src="voice.mp3" preload="auto"></audio>

    <!-- BANNER GESTIONE AUDIO -->
    <div id="volume-banner" class="volume-banner">
        <span id="banner-text">🔊 Alza il volume per ascoltare!</span>
    </div>

    <div class="sticky-container">
        
        <div class="scroll-hint" id="scroll-hint">
            Scorri verso il basso per aprire l'invito<br>↓
        </div>

        <div class="content-group" id="content-group">
            
            <!-- Questo div gestisce lo spazio quando la busta si apre -->
            <div class="spacer"></div>

            <div class="scene">
                <div class="envelope-back"></div>
                <div class="envelope-flap"></div>
                
                <div class="card-wrapper" id="card-wrapper">
                    <div class="card-inner" id="card-inner">
                        <div class="card-face card-front">
                            <img src="fronte.jpg" alt="Fronte Invito">
                        </div>
                        <div class="card-face card-back">
                            <img src="retro.jpg" alt="Retro Invito - Dettagli">
                        </div>
                    </div>
                </div>

                <div class="envelope-front"></div>
            </div>

            <div class="rsvp-section">
                <!-- Sostituisci il link qui sotto -->
                <a href="https://forms.gle/m3eYs4e3S3jLevTr6" target="_blank" class="rsvp-btn">Conferma la tua presenza</a>
                <div class="tap-hint">Tocca il biglietto per girarlo fronte/retro</div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentGroup = document.getElementById('content-group');
            const cardInner = document.getElementById('card-inner');
            const scrollHint = document.getElementById('scroll-hint');
            
            // Selettori Audio
            const audio = document.getElementById('invite-audio');
            const volumeBanner = document.getElementById('volume-banner');
            const bannerText = document.getElementById('banner-text');
            let audioAttempted = false; // Flag per far scattare l'audio una sola volta all'apertura

            window.addEventListener('scroll', () => {
                // Apri appena si scorre verso il basso
                if (window.scrollY > 15) {
                    
                    // Condizione per assicurarsi che l'evento scatti SOLO nel momento dell'apertura
                    if (!contentGroup.classList.contains('open')) {
                        contentGroup.classList.add('open');
                        scrollHint.style.opacity = '0';

                        // Gestione "Smart" Audio Autoplay
                        if (!audioAttempted) {
                            audioAttempted = true;
                            let playPromise = audio.play();
                            
                            if (playPromise !== undefined) {
                                playPromise.then(() => {
                                    // SUCCESSO: Il browser del telefono ha permesso la riproduzione automatica
                                    bannerText.innerHTML = "🔊 Ricordati di alzare il volume!";
                                    volumeBanner.classList.add('show');
                                    volumeBanner.classList.remove('interactive');
                                    
                                    // Scompare da solo dopo 2.5 secondi
                                    setTimeout(() => {
                                        volumeBanner.classList.remove('show');
                                    }, 2500);
                                    
                                }).catch(error => {
                                    // BLOCCATO: Il browser ha impedito l'autoplay (comune su Safari/Chrome Mobile)
                                    bannerText.innerHTML = "🔊 Tocca qui per ascoltare il messaggio";
                                    volumeBanner.classList.add('show', 'interactive');
                                    
                                    // Quando l'utente tocca il banner, sblocca e avvia l'audio
                                    volumeBanner.addEventListener('click', () => {
                                        audio.play();
                                        volumeBanner.classList.remove('show', 'interactive');
                                    }, { once: true });
                                });
                            }
                        }
                    }
                } 
                // Chiudi SOLO se l'utente scorre intenzionalmente tutto indietro fino allo zero assoluto
                else if (window.scrollY === 0) {
                    contentGroup.classList.remove('open');
                    scrollHint.style.opacity = '1';
                    cardInner.classList.remove('is-flipped');
                    
                    // Ferma la voce, azzera il timer audio e i controlli per permettere un nuovo ascolto
                    audio.pause();
                    audio.currentTime = 0;
                    audioAttempted = false;
                    volumeBanner.classList.remove('show', 'interactive');
                }
            });

            // Gira il biglietto toccandolo
            cardInner.addEventListener('click', () => {
                if (contentGroup.classList.contains('open')) {
                    cardInner.classList.toggle('is-flipped');
                }
            });
        });
    </script>

</body>
</html>
