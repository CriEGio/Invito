<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invito Matrimonio - Giorgio & Cristina</title>
    <style>
        /* --- STILI BASE --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #fdfaf6;
            font-family: 'Georgia', serif;
            /* L'altezza extra serve solo per permettere al dito di fare il gesto dello scroll */
            height: 150vh; 
        }

        /* --- CONTENITORE FISSO --- */
        /* Questo blocca la schermata in modo che non sfugga via mentre si scorre */
        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scroll-hint {
            position: absolute;
            top: 8%;
            font-size: 1.2rem;
            color: #666;
            text-align: center;
            animation: bounce 2s infinite;
            transition: opacity 0.5s ease-in-out;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(10px); }
            60% { transform: translateY(5px); }
        }

        /* --- GRUPPO ANIMATO (BUSTA + BOTTONE) --- */
        .content-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s ease-in-out;
            /* Lo abbassiamo leggermente in partenza per lasciare spazio sopra */
            margin-top: 15vh; 
        }

        /* Quando la busta si apre, tutto il gruppo (busta+bottone) scende un po' 
           per fare spazio al biglietto che sale, mantenendo tutto centrato */
        .content-group.open {
            transform: translateY(40px);
        }

        /* --- CONTENITORE BUSTA E BIGLIETTO --- */
        .scene {
            position: relative;
            width: 90vw;
            max-width: 750px;
            aspect-ratio: 2.5 / 1; 
            perspective: 1500px;
        }

        /* --- LA BUSTA --- */
        .envelope-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #d1c5b4;
            border-radius: 5px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            z-index: 1;
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #e3d8c8;
            border-radius: 5px;
            z-index: 3;
            clip-path: polygon(0 100%, 100% 100%, 100% 0, 50% 50%, 0 0);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 60%;
            background-color: #c4b6a2;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 4;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
        }

        /* --- IL BIGLIETTO (ANIMATO) --- */
        .card-wrapper {
            position: absolute;
            bottom: 5%;
            left: 2.5%;
            width: 95%;
            height: 90%;
            z-index: 2;
            transition: transform 1s ease-in-out;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 5px;
            overflow: hidden;
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Evita l'effetto blu di selezione quando si tocca col dito */
            user-select: none;
            -webkit-user-drag: none;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* --- ANIMAZIONI AL MOMENTO DELL'APERTURA --- */
        .content-group.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1; 
        }

        .content-group.open .card-wrapper {
            /* Ora il biglietto sale fino in cima, liberandosi dalla busta */
            transform: translateY(-95%); 
            z-index: 5; 
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- SEZIONE RSVP (BOTTONE) --- */
        .rsvp-section {
            /* Agganciato direttamente sotto la busta */
            margin-top: 30px; 
            text-align: center;
            opacity: 0;
            /* Rende il bottone cliccabile solo quando è visibile */
            visibility: hidden; 
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        .content-group.open .rsvp-section {
            opacity: 1;
            visibility: visible;
        }

        .rsvp-btn {
            background-color: #e2a527; 
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(226, 165, 39, 0.4);
            transition: background-color 0.3s, transform 0.2s;
            display: inline-block;
        }

        .rsvp-btn:hover {
            background-color: #9b8cbd; 
            transform: scale(1.05);
        }

        .tap-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Questo è il contenitore che rimane fisso e ferma lo scorrimento visivo della pagina -->
    <div class="sticky-container">
        
        <div class="scroll-hint" id="scroll-hint">
            Scorri verso il basso per aprire l'invito<br>↓
        </div>

        <!-- Gruppo che tiene insieme la busta e il bottone per un allineamento perfetto -->
        <div class="content-group" id="content-group">
            
            <div class="scene">
                <div class="envelope-back"></div>
                <div class="envelope-flap"></div>
                
                <div class="card-wrapper" id="card-wrapper">
                    <div class="card-inner" id="card-inner">
                        <div class="card-face card-front">
                            <img src="image_6616cf.jpg" alt="Fronte Invito">
                        </div>
                        <div class="card-face card-back">
                            <img src="image_6616b2.jpg" alt="Retro Invito - Dettagli">
                        </div>
                    </div>
                </div>

                <div class="envelope-front"></div>
            </div>

            <div class="rsvp-section">
                <!-- Ricorda di incollare qui il tuo link -->
                <a href="INSERISCI_QUI_IL_LINK_DEL_TUO_GOOGLE_FORM" target="_blank" class="rsvp-btn">Conferma la tua presenza</a>
                <div class="tap-hint">Tocca il biglietto per girarlo fronte/retro</div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentGroup = document.getElementById('content-group');
            const cardInner = document.getElementById('card-inner');
            const scrollHint = document.getElementById('scroll-hint');

            // L'evento "scroll" adesso non fa muovere la pagina, ma accende o spegne l'animazione
            window.addEventListener('scroll', () => {
                if (window.scrollY > 30) {
                    contentGroup.classList.add('open');
                    scrollHint.style.opacity = '0';
                } else {
                    contentGroup.classList.remove('open');
                    scrollHint.style.opacity = '1';
                    cardInner.classList.remove('is-flipped');
                }
            });

            // Gira il biglietto toccandolo (solo se la busta è aperta)
            cardInner.addEventListener('click', () => {
                if (contentGroup.classList.contains('open')) {
                    cardInner.classList.toggle('is-flipped');
                }
            });
        });
    </script>

</body>
</html>
